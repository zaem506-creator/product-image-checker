<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Audit - Local Shop</title>
<style>
:root{--bg:#fdfaf4;--card:#fff;--line:#eee5d6;--text:#4a2617;--muted:#8b7666;--yellow:#ffd400;--yellowd:#e8b800;
  --green:#1f8a4c;--greenbg:#e7f6ed;--red:#c0392b;--redbg:#fdecea;--blue:#2563eb;--bluebg:#eaf1ff;--orange:#d9600b;--orangebg:#fff0e3}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;border-top:5px solid var(--yellow);min-height:100vh}
button{font-family:inherit}
.hidden{display:none !important}
kbd{display:inline-block;min-width:18px;padding:0 5px;border:1px solid #dccfbb;border-bottom-width:2px;border-radius:5px;background:#fffdf9;
  font:600 11px/16px Consolas,monospace;color:var(--muted);text-align:center}

/* الشريط العلوي */
.top{background:#fffdf9;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(74,38,23,.05);position:sticky;top:0;z-index:20}
.bar{max-width:1600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:#f5efe4;color:var(--muted);white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status.saving{background:var(--bluebg);color:var(--blue)}
.status.saving::before{animation:pulse 1s infinite}
.status.saved{background:var(--greenbg);color:var(--green)}
.status.error{background:var(--redbg);color:var(--red)}
@keyframes pulse{50%{opacity:.25}}
.online{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.online i{display:inline-flex;align-items:center;gap:5px;font-style:normal;background:var(--greenbg);color:var(--green);padding:3px 9px;border-radius:999px;font-size:12.5px}
.online i::before,.dot{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px rgba(31,138,76,.18)}
.btn{background:#fffdf9;color:#3b2417;border:1px solid #e8dfd2;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;
  box-shadow:0 1px 2px rgba(74,38,23,.05);white-space:nowrap}
.btn:hover{background:#fbf5ea;border-color:#dccfbb}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--yellow);border-color:var(--yellowd)}
.btn.primary:hover{background:var(--yellowd)}
.btn.icon{padding:8px 12px}

/* أسماء الموظفين */
.tabs{max-width:1600px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 14px;
  font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.tab:hover{background:#f7efe0;color:var(--text)}
.tab small{font-weight:600;font-size:11px;padding:2px 7px;border-radius:999px;background:#f5efe4}
.tab .count{font:600 12px Consolas,monospace;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--yellow);border-color:var(--yellowd);color:var(--text);box-shadow:0 2px 0 var(--yellowd)}
.tab[aria-selected="true"] small{background:rgba(255,255,255,.6)}
.tab.complete .count{color:var(--green)}

.stage{max-width:1600px;margin:0 auto;padding:16px 16px 40px}

/* رسائل */
.notice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
.notice h2{color:var(--text);margin:0 0 8px}
.warn{background:#fff8e1;border:1px solid #f5d77a;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.err{background:var(--redbg);border:1px solid #f3c2bc;color:var(--red);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:14px;white-space:pre-line}

/* الإعدادات */
.setup{max-width:560px;margin:30px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.setup h2{margin:0 0 6px}
.setup p{color:var(--muted);margin:0 0 18px;font-size:14px}
.setup label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 6px}
.setup input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:14px Consolas,monospace;direction:ltr}
.setup .row{display:flex;gap:10px;margin-top:18px}

/* التقييم: اللوحة الجانبية بطول الشاشة بالضبط، وخانة الملاحظات تاخذ الباقي، فما تحتاج سكرول */
.eval{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(74,38,23,.04);
  position:sticky;top:var(--stick,120px);height:calc(100vh - var(--stick,120px) - 12px);min-height:430px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.head{padding-bottom:10px;border-bottom:1px solid var(--line)}
.head h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.code{display:flex;align-items:center;gap:6px;font:600 12.5px Consolas,monospace;direction:ltr;justify-content:flex-end}
.code button{border:0;background:#f5efe4;border-radius:6px;cursor:pointer;font-size:11.5px;padding:2px 7px;color:var(--muted)}
.progress{margin-top:6px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.pbar{height:5px;background:#f2eadc;border-radius:99px;overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.rowstate{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#f5efe4;color:var(--muted)}
.rowstate.done{background:var(--greenbg);color:var(--green)}

.group>label{display:block;font-weight:700;margin-bottom:5px;font-size:13px}
.chips{display:flex;flex-direction:column;gap:5px}
.chips.row{flex-direction:row}
.chips.row .chip{flex:1;justify-content:center;padding:7px 6px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:start;border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:7px 10px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;transition:.12s;direction:ltr;white-space:nowrap}
.chip:hover{border-color:#dccfbb;background:#fffcf5}
.chip[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellowd);box-shadow:0 2px 0 var(--yellowd)}
.chip[data-tone="good"][aria-pressed="true"]{background:var(--greenbg);border-color:var(--green);box-shadow:0 2px 0 var(--green);color:var(--green)}
.chip[data-tone="bad"][aria-pressed="true"]{background:var(--redbg);border-color:var(--red);box-shadow:0 2px 0 var(--red);color:var(--red)}
/* ألوان خيارات Info: Original أخضر، Claude برتقالي، Gemini أزرق، None أحمر */
.chip[data-tone="original"]{--c:var(--green)}
.chip[data-tone="claude"]{--c:var(--orange)}
.chip[data-tone="gemini"]{--c:var(--blue)}
.chip[data-tone="none"]{--c:var(--red)}
.chip[data-tone="original"],.chip[data-tone="claude"],.chip[data-tone="gemini"],.chip[data-tone="none"]{border-left:5px solid var(--c);color:var(--c)}
.chip[data-tone="original"][aria-pressed="true"],.chip[data-tone="claude"][aria-pressed="true"],.chip[data-tone="gemini"][aria-pressed="true"],.chip[data-tone="none"][aria-pressed="true"]{background:var(--c);border-color:var(--c);box-shadow:0 2px 0 rgba(0,0,0,.18);color:#fff}
.chip kbd{min-width:16px;font-size:10px;line-height:14px}
.chip[aria-pressed="true"] kbd{background:rgba(255,255,255,.85)}
.notes{flex:1;display:flex;flex-direction:column;min-height:72px}
textarea{flex:1;width:100%;min-height:44px;resize:none;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;font:14px/1.5 inherit;font-family:inherit}
textarea:focus,.setup input:focus,.jump input:focus{outline:2px solid var(--yellow);outline-offset:-1px}
.nav{display:grid;grid-template-columns:auto 1fr auto;gap:6px}
.nav .btn{padding:7px 10px;font-size:13.5px}
.jump{display:flex;gap:6px}
.jump input{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font:12.5px Consolas,monospace;direction:ltr}
.jump .btn{padding:6px 12px;font-size:13px}

/* الصور */
.ai{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.ai .tag{flex:none;font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px;background:#f5efe4;direction:ltr}
.ai .tag.good{background:var(--greenbg);color:var(--green)}
.ai .tag.bad{background:var(--redbg);color:var(--red)}
.ai p{margin:2px 0 0;color:var(--muted);direction:ltr;text-align:left;flex:1;line-height:1.5}
.images{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(74,38,23,.04);min-width:0}
.card.pick{border-color:var(--green);box-shadow:0 0 0 2px var(--greenbg)}
.card h4{margin:0 0 10px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h4::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--yellow);flex:none}
.card[data-img="old"] h4::before{background:var(--green)}
.card[data-img="claude"] h4::before{background:var(--orange)}
.card[data-img="gemini"] h4::before{background:var(--blue)}
.card h4 .badge{margin-inline-start:auto;font-size:11px;color:var(--green);background:var(--greenbg);padding:2px 8px;border-radius:99px}
.frame{display:block;border-radius:8px;border:1px solid #f0e9df;background:#faf7f2;min-height:160px;cursor:zoom-in;overflow:hidden;position:relative}
.frame:hover{border-color:var(--yellowd)}
.frame img{display:block;width:100%;height:auto}
.frame .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a99c92;font-size:13px;padding:10px;text-align:center}
.meta{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:#a99c92}
.meta span:last-child{font-family:Consolas,monospace;direction:ltr}

/* إشعارات */
.toasts{position:fixed;bottom:16px;left:16px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:380px}
.toast{background:#3b2417;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:in .2s}
.toast.bad{background:var(--red)}
.toast.good{background:var(--green)}
@keyframes in{from{transform:translateY(8px);opacity:0}}

/* عارض التكبير */
.lb{position:fixed;inset:0;z-index:40;background:#1b120d;display:flex;flex-direction:column;color:#f3e9dc}
.lb-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#2a1d15;flex-wrap:wrap}
.lb-tabs{display:flex;gap:6px}
.lb-tab{border:1px solid #4a372b;background:transparent;color:#cdbcaa;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.lb-tab[aria-selected="true"]{background:var(--yellow);border-color:var(--yellowd);color:var(--text)}
.lb-tab kbd{background:transparent;border-color:currentColor;color:inherit;opacity:.7}
.lb-bar .grow{flex:1}
.lb-zoom{font:600 13px Consolas,monospace;min-width:52px;text-align:center;direction:ltr}
.lb-btn{border:1px solid #4a372b;background:#3a2a1f;color:#f3e9dc;border-radius:8px;padding:6px 11px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none}
.lb-btn:hover{background:#4a372b}
.lb-stage{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background:#fff}
.lb-stage.drag{cursor:grabbing}
.lb-stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
.lb-stage.pixel img{image-rendering:pixelated}
.lb-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b7666}
.lb-help{padding:6px 14px;font-size:12px;color:#a8957f;background:#2a1d15}
.lb-help kbd{background:transparent;color:inherit;border-color:#5a4535}

/* الشاشات القصيرة (لابتوب مع شريط المتصفح): نضغط المسافات عشان اللوحة تنعرض كاملة */
@media(max-height:720px){
  .form{gap:7px;padding:12px}
  .head{padding-bottom:7px}
  .chip{padding:5px 10px}
  .chips{gap:4px}
  .group>label{margin-bottom:3px}
  .bar{padding:7px 16px}
  .tabs{padding-bottom:7px}
}

@media(max-width:1180px){.images{grid-template-columns:1fr 1fr}}
@media(max-width:860px){
  .top{position:static}
  .eval{grid-template-columns:1fr}
  .form{position:static;height:auto;min-height:0}
  .images{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="bar">
    <div class="brand"><b data-i18n="title"></b><span id="sheetTitle">Local Shop Tools</span></div>
    <div class="spacer"></div>
    <div class="online hidden" id="online"></div>
    <div class="status" id="status"></div>
    <button class="btn icon" id="btnRefresh" data-i18n="refresh" data-i18n-title="refreshTitle" disabled></button>
    <button class="btn icon" id="btnLang"></button>
    <button class="btn icon" id="btnSettings" data-i18n-title="settingsTitle">⚙</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<main class="stage">
  <div id="warn" class="warn hidden"></div>
  <div id="err" class="err hidden"></div>

  <section class="setup hidden" id="setup">
    <h2 data-i18n="setupH"></h2>
    <p data-i18n="setupP"></p>
    <label for="inUrl" data-i18n="setupUrl"></label>
    <input id="inUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <label for="inKey" data-i18n="setupKey"></label>
    <input id="inKey" autocomplete="off">
    <div class="row">
      <button class="btn primary" id="btnConnect" data-i18n="connect"></button>
      <button class="btn hidden" id="btnCancelSetup" data-i18n="cancel"></button>
    </div>
  </section>

  <div class="notice hidden" id="loading"><h2 data-i18n="loadingH"></h2><p data-i18n="loadingP"></p></div>
  <div class="notice hidden" id="pick"><h2 data-i18n="pickH"></h2><p data-i18n="pickP"></p></div>

  <div class="eval hidden" id="eval">
    <aside class="form" id="form">
      <div class="head">
        <h3><span id="lblAgent"></span><span class="rowstate" id="rowState"></span></h3>
        <div class="code"><button id="btnCopy" data-i18n="copy"></button><span id="lblCode"></span></div>
        <div class="progress"><span id="lblPos"></span><span id="lblDone"></span></div>
        <div class="pbar"><i id="pbar"></i></div>
      </div>

      <div class="group"><label data-i18n="verdict"></label><div class="chips row" id="verdicts"></div></div>
      <div class="group"><label data-i18n="info"></label><div class="chips" id="infos"></div></div>
      <div class="group notes">
        <label for="txtComments" data-i18n="notes"></label>
        <textarea id="txtComments" dir="auto" data-i18n-ph="notesPh"></textarea>
      </div>

      <div class="nav">
        <button class="btn" id="btnPrev" data-i18n="prev"></button>
        <button class="btn primary" id="btnNextTodo" data-i18n="nextTodo"></button>
        <button class="btn" id="btnNext" data-i18n="next"></button>
      </div>
      <form class="jump" id="jump">
        <input id="inJump" data-i18n-ph="jumpPh">
        <button class="btn" type="submit" data-i18n="jump"></button>
      </form>
    </aside>

    <section>
      <div class="ai hidden" id="ai"><span class="tag" id="aiTag"></span><p id="aiText"></p></div>
      <div class="images">
        <div class="card" data-img="old"><h4 data-i18n="imgOld"></h4><a class="frame" target="_blank" rel="noopener"><img alt=""><span class="msg"></span></a><div class="meta"><span data-i18n="imgHint"></span><span></span></div></div>
        <div class="card" data-img="claude"><h4 data-i18n="imgClaude"></h4><a class="frame" target="_blank" rel="noopener"><img alt=""><span class="msg"></span></a><div class="meta"><span data-i18n="imgHint"></span><span></span></div></div>
        <div class="card" data-img="gemini"><h4 data-i18n="imgGemini"></h4><a class="frame" target="_blank" rel="noopener"><img alt=""><span class="msg"></span></a><div class="meta"><span data-i18n="imgHint"></span><span></span></div></div>
      </div>
    </section>
  </div>
</main>

<div class="lb hidden" id="lb" role="dialog">
  <div class="lb-bar">
    <div class="lb-tabs" id="lbTabs"></div>
    <div class="grow"></div>
    <button class="lb-btn" id="lbOut" data-i18n-title="zoomOut">−</button>
    <span class="lb-zoom" id="lbZoom">100%</span>
    <button class="lb-btn" id="lbIn" data-i18n-title="zoomIn">+</button>
    <button class="lb-btn" id="lbFit" data-i18n="fit"></button>
    <button class="lb-btn" id="lbReal" data-i18n="real"></button>
    <a class="lb-btn" id="lbOpen" target="_blank" rel="noopener" data-i18n="openTab"></a>
    <button class="lb-btn" id="lbClose" data-i18n-title="close">✕</button>
  </div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""><div class="lb-msg" id="lbMsg"></div></div>
  <div class="lb-help" data-i18n-html="lbHelp"></div>
</div>

<div class="toasts" id="toasts"></div>

<script>
/* ============ طريقة الملف المحلي فقط: رابط السكربت وكلمة السر ============
   لما تنفتح الأداة من رابط السكربت نفسه (الطريقة الموصى بها)، ما تحتاج هذول. */
const API_URL = "";
const API_KEY = "";
/* ========================================================================= */

/* ---------------- اللغة ----------------
   الاختيار ينحفظ في متصفح كل موظف لحاله، وما يأثر على أحد ثاني. */
const I18N = {
  ar: {
    title: "أداة تدقيق الصور",
    refresh: "⟳ تحديث", refreshTitle: "تحديث البيانات من الشيت", settingsTitle: "إعدادات الاتصال", langBtn: "English",
    offline: "غير متصل", connected: "متصل", saving: "جار الحفظ…", saved: "تم الحفظ تلقائيا {time}",
    retry: "تعذر الحفظ، تجري إعادة المحاولة… ({n})", noNetSave: "لا يوجد اتصال بالإنترنت، وسيتم الحفظ عند عودته ({n})",
    onlineNow: "متصل الآن:", onlineTip: "متصل الآن — المنتج {pos} من {total}",
    setupH: "الاتصال بـ Google Sheets", setupP: "الصق رابط تطبيق الويب وكلمة المرور التي زودك بها المشرف. تحفظ في هذا المتصفح فقط.",
    setupUrl: "رابط تطبيق الويب (ينتهي بـ /exec)", setupKey: "كلمة المرور (API_KEY)", connect: "اتصال", cancel: "إلغاء",
    loadingH: "جار التحميل…", loadingP: "يجري جلب البيانات من Google Sheets",
    pickH: "اختر اسمك من الأعلى", pickP: "ستظهر لك المنتجات المسندة إليك فقط، ويحفظ التقييم تلقائيا في الشيت دون الحاجة إلى زر حفظ.",
    copy: "نسخ", pos: "المنتج {pos} من {total}", done: "تم تقييم {n}",
    stateDone: "تم التقييم", stateTodo: "لم يقيم",
    verdict: "القرار (Verdict)", info: "التفاصيل (Info)", notes: "الملاحظات",
    notesPh: "اكتب ملاحظتك هنا، وتحفظ تلقائيا بعد التوقف عن الكتابة بثانية",
    prev: "→ السابق", next: "التالي ←", nextTodo: "التالي غير المقيم", jumpPh: "رقم المنتج أو كوده", jump: "انتقال",
    content: "محتوى", quality: "جودة",
    imgOld: "الصورة القديمة (Old)", imgClaude: "صورة Claude", imgGemini: "صورة Gemini", imgHint: "انقر للتكبير بالدقة الكاملة",
    imgLoading: "جار التحميل…", imgNone: "لا يوجد رابط", imgError: "تعذر تحميل الصورة، انقر لفتح الرابط", lbError: "تعذر تحميل الصورة",

const LS = {
  get(k, d) { try { const v = localStorage.getItem("audit." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("audit." + k, JSON.stringify(v)); } catch {} },
};
let lang = LS.get("lang", "ar") === "en" ? "en" : "ar";
function t(key, vars) {
  let s = (I18N[lang][key] ?? I18N.ar[key] ?? key);
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
const rtl = () => lang === "ar";

const TEXT_DELAY = 1000;           // الحفظ بعد التوقف عن الكتابة
const $ = (id) => document.getElementById(id);
const cfg = { url: API_URL || LS.get("url", ""), key: API_KEY || LS.get("key", "") };
let agents = [], options = {}, cur = null, tasks = [], idx = 0;

/* ---------------- الاتصال ---------------- */
// لما تنفتح الصفحة من رابط السكربت نفسه، تكلمه مباشرة بـ google.script.run (بدون رابط ولا كلمة سر)
const GAS = typeof google !== "undefined" && google.script && google.script.run ? google.script.run : null;
const connected = () => !!(GAS || cfg.url);
function gas(fn, arg) {
  return new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler((e) => fail(new Error(e && e.message || String(e))))[fn](arg))
    .then((d) => { if (!d || !d.ok) throw new Error((d && d.error) || t("unknown")); return d; });
}

async function api(params) {
  if (GAS) return gas(params.action === "ping" ? "apiPing" : "apiRead", params);
  const q = new URLSearchParams({ ...params, key: cfg.key, t: Date.now() });
  return parse(await send(cfg.url + "?" + q, { redirect: "follow" }));
}
async function apiPost(body) {
  if (GAS) return gas("apiSave", body);
  // نص عادي (text/plain) عشان المتصفح ما يرسل طلب CORS مسبق يرفضه Apps Script
  return parse(await send(cfg.url, { method: "POST", body: JSON.stringify({ ...body, key: cfg.key }), redirect: "follow" }));
}
async function send(url, opts) {
  try { return await fetch(url, opts); } catch { throw new Error(navigator.onLine ? t("blocked") : t("noNet")); }
}
async function parse(res) {
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error(/<html|<!doctype/i.test(text) ? t("htmlReply") : t("badReply", { status: res.status })); }
  if (!data.ok) throw new Error(data.error || t("unknown"));
  return data;
}

/* ---------------- الحفظ التلقائي ---------------- */
// كل تعديل ينضاف لطابور. الطابور ينحفظ في المتصفح كمان، فلو انقطع النت أو انسكّرت الصفحة ما يضيع شي.
const pending = new Map(LS.get("pending", []));
let inFlight = null, flushTimer = 0, retryDelay = 0, lastSaved = null, saveError = "";

const pkey = (role, agent, row) => role + "|" + agent + "|" + row;
function persist() {
  const all = new Map(pending);
  if (inFlight) for (const u of inFlight) if (!all.has(u.id)) all.set(u.id, u);
  LS.set("pending", [...all]);
}

function setField(task, field, value, delay) {
  if (!task || task[field] === value) return;
  task[field] = value;
  const id = pkey(cur.role, cur.agent, task.row);
  const u = pending.get(id) || { id, row: task.row, code: task.code, agent: cur.agent, role: cur.role, fields: {} };
  u.fields[field] = value;
  pending.set(id, u);
  persist();
  renderProgress();
  schedule(delay);
}

function schedule(delay) {
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, delay);
  renderStatus();
}

function saveErrorText(r, u) {
  if (r.code === "reassigned") return t("reassigned", { code: u ? u.code : "", agent: r.assigned || t("nobody") });
  if (r.code === "gone") return t("gone", { code: u ? u.code : "" });
  return r.error;
}

async function flush() {
  clearTimeout(flushTimer);
  if (inFlight || !pending.size || !connected()) return renderStatus();
  inFlight = [...pending.values()];
  pending.clear();
  renderStatus();
  try {
    const res = await apiPost({ action: "save", updates: inFlight });
    for (const r of res.results) if (!r.ok) toast(saveErrorText(r, inFlight.find((u) => u.id === r.id)), "bad");
    lastSaved = new Date(); saveError = ""; retryDelay = 0;
  } catch (e) {
    // رجّع اللي فشل للطابور، والتعديلات الأحدث تغلب
    for (const u of inFlight) {
      const newer = pending.get(u.id);
      pending.set(u.id, newer ? { ...u, fields: { ...u.fields, ...newer.fields } } : u);
    }
    saveError = e.message;
    retryDelay = Math.min(retryDelay ? retryDelay * 2 : 2000, 30000);
  }
  inFlight = null;
  persist();
  if (pending.size) schedule(retryDelay || 300); else renderStatus();
}

function renderStatus() {
  const el = $("status");
  const waiting = pending.size + (inFlight ? inFlight.length : 0);
  el.title = "";
  if (saveError && pending.size) {
    el.className = "status error";
    el.textContent = t(navigator.onLine ? "retry" : "noNetSave", { n: waiting });
    el.title = saveError;
  } else if (waiting) {
    el.className = "status saving"; el.textContent = t("saving");
  } else if (lastSaved) {
    el.className = "status saved";
    el.textContent = t("saved", { time: lastSaved.toLocaleTimeString(rtl() ? "ar-SA-u-nu-latn" : "en-US", { hour: "2-digit", minute: "2-digit" }) });
  } else if (agents.length) {
    el.className = "status saved"; el.textContent = t("connected");
  } else {
    el.className = "status"; el.textContent = t("offline");
  }
}

window.addEventListener("online", () => { retryDelay = 0; flush(); });
window.addEventListener("beforeunload", (e) => {
  commitText();
  if (!pending.size && !inFlight) return;
  if (pending.size && cfg.url && navigator.sendBeacon) {
    navigator.sendBeacon(cfg.url, new Blob([JSON.stringify({ action: "save", key: cfg.key, updates: [...pending.values()] })], { type: "text/plain" }));
  }
  e.preventDefault(); e.returnValue = "";
});

/* ---------------- المتصلون الآن ----------------
   نبضة كل 30 ثانية: ترسل اسم الموظف المختار ورقم المنتج، وترجع قائمة اللي فاتحين الأداة الحين. */
let online = [], pingTimer = 0;
const agentKey = (a) => a.role + "|" + a.name;
async function ping() {
  clearTimeout(pingTimer);
  pingTimer = setTimeout(ping, 30000);
  if (!agents.length || document.hidden) return;
  try {
    const me = cur ? { name: cur.agent, role: cur.role, pos: idx + 1, total: tasks.length } : {};
    const res = await api({ action: "ping", ...me, names: JSON.stringify(agents.map(agentKey)) });
    online = res.online || [];
    renderOnline();
    renderTabs();
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) ping(); });

function onlineOf(a) { return online.find((o) => o.name === a.name && o.role === a.role); }
function renderOnline() {
  const box = $("online");
  box.innerHTML = "";
  box.classList.toggle("hidden", !online.length);
  if (!online.length) return;
  box.append(t("onlineNow"));
  for (const o of online) {
    const i = document.createElement("i");
    i.textContent = o.name;
    i.title = t(o.role) + " · " + t("onlineTip", { pos: o.pos, total: o.total }) + (o.email ? "\n" + o.email : "");
    box.append(i);
  }
}

/* ---------------- تحميل البيانات ---------------- */
async function start() {
  show("loading");
  hideErr();
  try {
    const data = await api({ action: "init" });
    agents = data.agents; options = data.options;
    $("sheetTitle").textContent = data.title;
    $("btnRefresh").disabled = false;
    const w = $("warn");
    w.classList.toggle("hidden", !data.missing.length);
    w.textContent = data.missing.length ? t("missing", { cols: data.missing.join(", ") }) : "";
    renderTabs();
    renderStatus();
    flush(); // أي تعديلات بقيت من آخر مرة
    const last = LS.get("agent", null);
    const a = last && agents.find((x) => x.name === last.name && x.role === last.role);
    if (a) await openAgent(a); else { show(agents.length ? "pick" : null); ping(); }
    if (!agents.length) showErr(t("noAgents"));
  } catch (e) {
    show(null);
    showErr(t("errConnect", { e: e.message }));
    if (!API_URL && !GAS) openSetup(true);
  }
}

function renderTabs() {
  const box = $("tabs");
  box.innerHTML = "";
  for (const a of agents) {
    const b = document.createElement("button");
    b.className = "tab" + (a.done >= a.total ? " complete" : "");
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(!!cur && cur.agent === a.name && cur.role === a.role));
    const o = onlineOf(a);
    if (o) { const d = document.createElement("span"); d.className = "dot"; b.title = t("onlineTip", { pos: o.pos, total: o.total }); b.append(d); }
    b.append(a.name);
    const role = document.createElement("small"); role.textContent = t(a.role);
    const count = document.createElement("span"); count.className = "count"; count.textContent = a.done + "/" + a.total;
    b.append(role, count);
    b.onclick = () => openAgent(a);
    box.append(b);
  }
}

async function openAgent(a, keepRow) {
  commitText();
  textOwner = null;
  await flushNow();
  cur = { agent: a.name, role: a.role };
  LS.set("agent", { name: a.name, role: a.role });
  renderTabs();
  if (!keepRow) show("loading");
  try {
    const data = await api({ action: "tasks", agent: a.name, role: a.role });
    tasks = data.tasks;
    // التعديلات اللي لسه ما وصلت الشيت تغلب على اللي رجع منه
    for (const u of pending.values()) {
      if (u.role !== cur.role || u.agent !== cur.agent) continue;
      const x = tasks.find((y) => y.row === u.row && y.code === u.code);
      if (x) Object.assign(x, u.fields);
    }
  } catch (e) {
    showErr(t("errTasks", { e: e.message }));
    return show(null);
  }
  if (!tasks.length) { show("pick"); return toast(t("noTasks", { name: a.name })); }
  const row = keepRow || LS.get("pos." + a.role + "|" + a.name, 0);
  let i = tasks.findIndex((x) => x.row === row);
  if (i < 0) i = Math.max(tasks.findIndex((x) => !isDone(x.verdict)), 0);
  options.cur = options[a.role];
  buildChips();
  show("eval");
  go(i);
  ping();
}

async function flushNow() {
  if (pending.size) await flush();
  for (let n = 0; inFlight && n < 100; n++) await new Promise((r) => setTimeout(r, 100));
}

/* ---------------- العرض ---------------- */
function isDone(v) { const s = String(v || "").trim().toLowerCase(); return s !== "" && s !== "new"; }
function tone(v) {
  const s = v.toLowerCase();
  if (/none/.test(s)) return "none";
  if (/gem/.test(s)) return "gemini";
  if (/claude/.test(s)) return "claude";
  if (/original/.test(s)) return "original";
  return /approved/.test(s) ? "good" : /fix|reject/.test(s) ? "bad" : "";
}

function buildChips() {
  let n = 1;
  const make = (box, list, field) => {
    box.innerHTML = "";
    for (const v of list) {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.dataset.value = v; b.dataset.tone = tone(v);
      const k = n <= 9 ? String(n++) : "";
      b.dataset.key = k;
      const label = document.createElement("span"); label.textContent = v.trim();
      b.append(label);
      if (k) { const kb = document.createElement("kbd"); kb.textContent = k; b.append(kb); }
      b.onclick = () => pickChip(field, v, true);
      box.append(b);
    }
  };
  make($("verdicts"), options.cur.verdict, "verdict");
  make($("infos"), options.cur.info, "info");
}

function pickChip(field, v, toggle) {
  const task = tasks[idx];
  setField(task, field, toggle && task[field] === v ? "" : v, 0); // الضغط بالماوس مرة ثانية يلغي الاختيار
  renderChips();
}

function renderChips() {
  const task = tasks[idx];
  for (const [box, field] of [[$("verdicts"), "verdict"], [$("infos"), "info"]]) {
    for (const b of box.children) b.setAttribute("aria-pressed", String(b.dataset.value === task[field]));
  }
}

function go(i, keepImages) {
  if (!tasks.length) return;
  if (!keepImages) commitText();
  const moved = idx !== i;
  idx = Math.max(0, Math.min(i, tasks.length - 1));
  const task = tasks[idx];
  LS.set("pos." + cur.role + "|" + cur.agent, task.row);

  $("lblAgent").textContent = cur.agent + " · " + t(cur.role);
  $("lblCode").textContent = task.code || "—";
  if (!keepImages) { $("txtComments").value = task.comments; textOwner = task; }
  renderChips();
  renderProgress();
  $("btnPrev").disabled = idx === 0;
  $("btnNext").disabled = idx === tasks.length - 1;

  // قرار الفرز الآلي وتعليق كلود
  const ai = task.aiDecision.trim();
  $("ai").classList.toggle("hidden", !ai && !task.aiComment.trim());
  $("aiTag").textContent = ai || t("aiNone");
  $("aiTag").className = "tag " + (/approved/i.test(ai) ? "good" : /reject/i.test(ai) ? "bad" : "");
  $("aiText").textContent = task.aiComment;
  const pick = /claude/i.test(ai) ? "claude" : /gemini/i.test(ai) ? "gemini" : /original/i.test(ai) ? "old" : "";

  for (const card of document.querySelectorAll(".card")) {
    const k = card.dataset.img;
    if (!keepImages) setImage(card, task[k]);
    card.classList.toggle("pick", k === pick);
    let badge = card.querySelector(".badge");
    if (k === pick && !badge) { badge = document.createElement("span"); badge.className = "badge"; card.querySelector("h4").append(badge); }
    if (k !== pick && badge) badge.remove();
    if (badge && k === pick) badge.textContent = t("aiPick");
  }
  if (!keepImages) { preload(idx + 1); preload(idx + 2); }
  if (moved && !keepImages) { clearTimeout(go.pt); go.pt = setTimeout(ping, 1500); }
}

for (const card of document.querySelectorAll(".card")) {
  card.querySelector("a").addEventListener("click", (e) => {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return; // Ctrl+كلك يفتح تبويب جديد عادي
    e.preventDefault();
    if (tasks[idx] && tasks[idx][card.dataset.img]) openViewer(card.dataset.img);
  });
}

function setImage(card, url) {
  const a = card.querySelector("a"), img = card.querySelector("img"), msg = card.querySelector(".msg"), size = card.querySelector(".meta span:last-child");
  size.textContent = "";
  img.onload = img.onerror = null;
  if (!url) { a.removeAttribute("href"); img.removeAttribute("src"); img.style.display = "none"; msg.textContent = t("imgNone"); return; }
  a.href = url;
  msg.textContent = t("imgLoading");
  img.style.display = "";
  img.onload = () => { msg.textContent = ""; size.textContent = img.naturalWidth + "×" + img.naturalHeight; };
  img.onerror = () => { img.style.display = "none"; msg.textContent = t("imgError"); };
  img.src = url;
}

function preload(i) {
  const x = tasks[i];
  if (x) for (const u of [x.old, x.claude, x.gemini]) if (u) new Image().src = u;
}

function renderProgress() {
  const task = tasks[idx];
  const done = tasks.filter((x) => isDone(x.verdict)).length;
  $("lblPos").textContent = t("pos", { pos: idx + 1, total: tasks.length });
  $("lblDone").textContent = t("done", { n: done });
  $("pbar").style.width = (tasks.length ? (done / tasks.length) * 100 : 0) + "%";
  const st = $("rowState");
  st.textContent = t(isDone(task.verdict) ? "stateDone" : "stateTodo");
  st.className = "rowstate" + (isDone(task.verdict) ? " done" : "");
  const a = agents.find((x) => x.name === cur.agent && x.role === cur.role);
  if (a && a.done !== done) { a.done = done; renderTabs(); }
}

function nextTodo() {
  commitText();
  for (let k = 1; k <= tasks.length; k++) {
    const j = (idx + k) % tasks.length;
    if (!isDone(tasks[j].verdict)) return go(j);
  }
  toast(t("allDone"), "good");
}

/* الملاحظات: تنحفظ بعد ثانية من آخر حرف، أو فوراً لما تطلع من الخانة أو تنتقل.
   textOwner = المنتج اللي ملاحظته معروضة الحين في الخانة */
let textOwner = null;
function commitText(delay = 0) {
  if (textOwner) setField(textOwner, "comments", $("txtComments").value, delay);
}
$("txtComments").addEventListener("input", () => commitText(TEXT_DELAY));
$("txtComments").addEventListener("blur", () => commitText(0));

/* ---------------- الأزرار ---------------- */
$("btnPrev").onclick = () => go(idx - 1);
$("btnNext").onclick = () => { if (idx === tasks.length - 1) toast(t("last")); else go(idx + 1); };
$("btnNextTodo").onclick = nextTodo;
$("btnCopy").onclick = () => { navigator.clipboard?.writeText(tasks[idx].code).then(() => toast(t("copied"))); };
$("btnLang").onclick = () => { lang = rtl() ? "en" : "ar"; LS.set("lang", lang); applyLang(); };
$("jump").onsubmit = (e) => {
  e.preventDefault();
  const v = $("inJump").value.trim();
  if (!v) return;
  let i = tasks.findIndex((x) => x.code.trim() === v);
  if (i < 0 && /^\d+$/.test(v) && v.length < 6) i = Number(v) - 1;
  if (i < 0 || i >= tasks.length) return toast(t("notFound"), "bad");
  $("inJump").value = "";
  go(i);
};
$("btnRefresh").onclick = async () => {
  await flushNow();
  const keep = cur && tasks[idx] ? { a: cur, row: tasks[idx].row } : null;
  try {
    const data = await api({ action: "init" });
    agents = data.agents; options = data.options;
    const a = keep && agents.find((x) => x.name === keep.a.agent && x.role === keep.a.role);
    if (a) await openAgent(a, keep.row); else { cur = null; renderTabs(); show("pick"); }
    toast(t("refreshed"));
  } catch (e) { toast(e.message, "bad"); }
};

// الأسهم تمشي مع اتجاه اللغة: في العربي ← التالي، وفي الإنجليزي → التالي
const nextArrow = () => (rtl() ? "ArrowLeft" : "ArrowRight");
const prevArrow = () => (rtl() ? "ArrowRight" : "ArrowLeft");

document.addEventListener("keydown", (e) => {
  if (!$("lb").classList.contains("hidden")) return viewerKey(e);
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const typing = /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
  if (typing) { if (e.key === "Escape") document.activeElement.blur(); return; }
  if ($("eval").classList.contains("hidden")) return;
  const chip = document.querySelector('.chip[data-key="' + e.key + '"]');
  if (chip) { e.preventDefault(); return pickChip(chip.parentElement.id === "verdicts" ? "verdict" : "info", chip.dataset.value, false); }
  if (e.key === nextArrow()) { e.preventDefault(); $("btnNext").click(); }
  else if (e.key === prevArrow()) { e.preventDefault(); if (idx > 0) go(idx - 1); }
  else if (e.key.toLowerCase() === "n") { e.preventDefault(); nextTodo(); }
  else if (e.key.toLowerCase() === "c") { e.preventDefault(); $("txtComments").focus(); }
  else if (e.key.toLowerCase() === "z") { e.preventDefault(); const x = tasks[idx]; const k = ["claude", "gemini", "old"].find((y) => x[y]); if (k) openViewer(k); }
});

/* ---------------- عارض التكبير ----------------
   view = مكان النظر كنسبة من الصورة (cx, cy) + التكبير نسبةً لملء الشاشة (rel).
   لما تتنقل بين الصور يبقى نفس المكان ونفس التكبير، حتى لو مقاسات الصور مختلفة. */
const IMG_NAMES = { old: "Old", claude: "Claude", gemini: "Gemini" };
const lb = { key: "", view: null, nw: 0, nh: 0, s: 1, x: 0, y: 0 };

function openViewer(key) {
  $("lb").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  lb.view = null; lb.nw = 0;
  showInViewer(key);
}
function closeViewer() {
  $("lb").classList.add("hidden");
  document.body.style.overflow = "";
}
function viewerKeys() { const x = tasks[idx]; return ["old", "claude", "gemini"].filter((k) => x && x[k]); }

function showInViewer(key) {
  const url = tasks[idx][key];
  lb.key = key;
  const tabs = $("lbTabs");
  tabs.innerHTML = "";
  viewerKeys().forEach((k, i) => {
    const b = document.createElement("button");
    b.className = "lb-tab"; b.setAttribute("aria-selected", String(k === key));
    const kb = document.createElement("kbd"); kb.textContent = i + 1;
    b.append(kb, IMG_NAMES[k]);
    b.onclick = () => showInViewer(k);
    tabs.append(b);
  });
  $("lbOpen").href = url;
  const img = $("lbImg");
  if (lb.nw) lb.view = currentView();
  $("lbMsg").textContent = t("imgLoading");
  img.style.visibility = "hidden";
  img.onload = () => {
    lb.nw = img.naturalWidth; lb.nh = img.naturalHeight;
    $("lbMsg").textContent = "";
    img.style.visibility = "";
    applyView(lb.view || { cx: 0.5, cy: 0.5, rel: 1 });
  };
  img.onerror = () => { $("lbMsg").textContent = t("lbError"); };
  img.src = url;
  if (img.complete && img.naturalWidth) img.onload();
}

function stageSize() { const r = $("lbStage").getBoundingClientRect(); return { w: r.width, h: r.height }; }
function fitScale() { const { w, h } = stageSize(); return Math.min(w / lb.nw, h / lb.nh); }
function currentView() {
  const { w, h } = stageSize();
  return { cx: (w / 2 - lb.x) / lb.s / lb.nw, cy: (h / 2 - lb.y) / lb.s / lb.nh, rel: lb.s / fitScale() };
}
function applyView(v) {
  const { w, h } = stageSize();
  lb.s = Math.min(Math.max(v.rel * fitScale(), 0.05), 16);
  lb.x = w / 2 - v.cx * lb.nw * lb.s;
  lb.y = h / 2 - v.cy * lb.nh * lb.s;
  render();
}
function zoomAt(factor, px, py) {
  const { w, h } = stageSize();
  if (px == null) { px = w / 2; py = h / 2; }
  const ns = Math.min(Math.max(lb.s * factor, 0.05), 16);
  lb.x = px - (px - lb.x) * (ns / lb.s);
  lb.y = py - (py - lb.y) * (ns / lb.s);
  lb.s = ns;
  render();
}
function render() {
  $("lbImg").style.transform = "translate(" + lb.x + "px," + lb.y + "px) scale(" + lb.s + ")";
  $("lbZoom").textContent = Math.round(lb.s * 100) + "%";
  $("lbStage").classList.toggle("pixel", lb.s >= 3);
}
function setFit() { applyView({ cx: 0.5, cy: 0.5, rel: 1 }); }
function setReal(px, py) { zoomAt(1 / lb.s, px, py); }
function switchImage(step) {
  const keys = viewerKeys();
  showInViewer(keys[(keys.indexOf(lb.key) + step + keys.length) % keys.length]);
}

$("lbClose").onclick = closeViewer;
$("lbFit").onclick = setFit;
$("lbReal").onclick = () => setReal();
$("lbIn").onclick = () => zoomAt(1.25);
$("lbOut").onclick = () => zoomAt(0.8);
$("lbStage").addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = $("lbStage").getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
$("lbStage").addEventListener("dblclick", (e) => {
  const r = $("lbStage").getBoundingClientRect();
  if (Math.abs(lb.s - fitScale()) < 0.01) setReal(e.clientX - r.left, e.clientY - r.top); else setFit();
});
(() => {
  let drag = null;
  const st = $("lbStage");
  st.addEventListener("pointerdown", (e) => { drag = { x: e.clientX - lb.x, y: e.clientY - lb.y }; st.setPointerCapture(e.pointerId); st.classList.add("drag"); });
  st.addEventListener("pointermove", (e) => { if (!drag) return; lb.x = e.clientX - drag.x; lb.y = e.clientY - drag.y; render(); });
  const end = () => { drag = null; st.classList.remove("drag"); };
  st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end);
})();
window.addEventListener("resize", () => { if (!$("lb").classList.contains("hidden") && lb.nw) applyView(currentView()); });

function viewerKey(e) {
  const k = e.key;
  if (k === "Escape") closeViewer();
  else if (k === nextArrow()) switchImage(1);
  else if (k === prevArrow()) switchImage(-1);
  else if (/^[1-3]$/.test(k)) { const keys = viewerKeys(); if (keys[k - 1]) showInViewer(keys[k - 1]); }
  else if (k === "+" || k === "=") zoomAt(1.25);
  else if (k === "-") zoomAt(0.8);
  else if (k === "0") setFit();
  else return;
  e.preventDefault();
}

/* ---------------- الإعدادات (طريقة الملف المحلي) ---------------- */
function openSetup(required) {
  $("inUrl").value = cfg.url; $("inKey").value = cfg.key;
  $("btnCancelSetup").classList.toggle("hidden", !!required);
  $("setup").classList.remove("hidden");
  for (const id of ["loading", "pick", "eval"]) $(id).classList.add("hidden");
}
$("btnSettings").onclick = () => openSetup(!cfg.url);
$("btnCancelSetup").onclick = () => { $("setup").classList.add("hidden"); show(cur ? "eval" : "pick"); };
$("btnConnect").onclick = () => {
  const url = $("inUrl").value.trim(), key = $("inKey").value.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(url)) return toast(t("badUrl"), "bad");
  cfg.url = url; cfg.key = key;
  LS.set("url", url); LS.set("key", key);
  $("setup").classList.add("hidden");
  start();
};

/* ---------------- أدوات ---------------- */
function show(id) { for (const x of ["loading", "pick", "eval"]) $(x).classList.toggle("hidden", x !== id); stick(); }
function showErr(m) { $("err").textContent = m; $("err").classList.remove("hidden"); }
function hideErr() { $("err").classList.add("hidden"); }
function toast(m, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || ""); el.textContent = m;
  $("toasts").append(el);
  setTimeout(() => el.remove(), kind === "bad" ? 6000 : 2500);
}
function stick() { document.documentElement.style.setProperty("--stick", $("top").offsetHeight + 12 + "px"); }
window.addEventListener("resize", stick);

if (GAS) $("btnSettings").classList.add("hidden");
applyLang();
if (connected()) start(); else openSetup(true);
</script>
